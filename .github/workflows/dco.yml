# Every commit in a pull request must carry a Developer Certificate of Origin
# sign-off (git commit -s). See CONTRIBUTING.md.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <[^>]+@[^>]+>$'; then
              echo "::error::Commit $(git show -s --format='%h %s' "$sha") has no Signed-off-by line. Use 'git commit -s' (see CONTRIBUTING.md)."
              missing=1
            fi
          done
          exit $missing
