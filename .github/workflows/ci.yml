name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Python verifies the Python generator library and converted warriors.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      # Checks the Cloudflare configuration and Worker bundle without deploying.
      # (Wrangler itself needs Node 22; the game and CLI run on Node 18+.)
      - if: matrix.node == 22
        run: npx wrangler deploy --dry-run --outdir dist-check
